<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-orange-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#993300" />
      <stop offset="45%" stop-color="#B84200" />
      <stop offset="100%" stop-color="#E55B13" />
    </linearGradient>
    <linearGradient id="logo-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1810" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
    <linearGradient id="logo-accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E55B13" />
      <stop offset="100%" stop-color="#FF7A30" />
    </linearGradient>
  </defs>

  <!-- Left Monogram Emblem -->
  <g transform="translate(6, 4) scale(0.92)">
    <!-- Left Stem of M / Spine (Deep Warm Charcoal) -->
    <path 
      d="M 16 84 L 16 24 L 31 24 L 31 69 L 16 84 Z" 
      fill="url(#logo-dark-grad)" 
    />

    <!-- Top Left Wing / Open Book Left Page -->
    <path 
      d="M 23 33 C 33 25, 43 25, 50 32 C 44 22, 32 22, 23 28 Z" 
      fill="url(#logo-orange-grad)" 
      opacity="0.9"
    />

    <!-- Top Right Wing / Open Book Right Page -->
    <path 
      d="M 50 32 C 57 25, 67 25, 77 33 C 68 28, 56 22, 50 32 Z" 
      fill="url(#logo-accent-glow)" 
      opacity="0.95"
    />

    <!-- Dynamic Ascending Central Arrow -->
    <path 
      d="M 31 69 L 50 40 L 67 23 L 61 20 L 86 14 L 80 39 L 74 33 L 50 54 L 31 69 Z" 
      fill="url(#logo-orange-grad)" 
    />

    <!-- Arrow Head Highlights -->
    <polygon 
      points="86,14 67,23 74,33" 
      fill="#FF7A30" 
    />
    <polygon 
      points="86,14 61,20 67,23" 
      fill="#993300" 
    />

    <!-- Bottom B-Curve / Base Foundation Loop -->
    <path 
      d="M 31 69 C 45 82, 76 84, 76 64 C 76 51, 62 47, 52 48 L 52 59 C 60 59, 65 61, 65 65 C 65 70, 48 70, 31 69 Z" 
      fill="url(#logo-dark-grad)" 
    />
  </g>

  <!-- Typography: BOOK in Deep Charcoal, METHAT in Burnt Orange -->
  <text x="106" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5px">
    <tspan fill="#1A1A1A">BOOK</tspan><tspan fill="#B84200">METHAT</tspan>
  </text>

  <!-- Subtitle Tagline with refined letter-spacing -->
  <text x="108" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#6B7280" letter-spacing="2.8px">
    EASY SCHEDULING &amp; BOOKINGS
  </text>
</svg>
